apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: backend
    spec:
      enableServiceLinks: false 
      containers:
      - image: mini-hdfs/backend:v1
        name: backend
        ports:
        - containerPort: 8000
        env:
          - name: NAMENODE_HOST
            value: "namenode"
          - name: NAMENODE_REQ_PORT
            value: "5050"

---

apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: backend
  name: backend
spec:
  ports:
  - name: 8000-8000
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: backend
  type: ClusterIP